  - id: external_api_timeout_branch
    input:
      employee_id: EMP-001
      message: "Мне нужно 18 сентября утром попасть из Казани в Санкт-Петербург и вернуться на следующий день. [scenario=timeout]"
    expected_output:
      status: propose_constraint_change
      approval_request_id: null
    expected_tools:
      required:
