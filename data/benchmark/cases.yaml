  - id: external_api_error_5xx_branch
    input:
      employee_id: EMP-001
      message: "Мне нужно 18 сентября утром попасть из Казани в Санкт-Петербург и вернуться на следующий день. [scenario=error_5xx]"
    expected_output:
      status: propose_constraint_change
      approval_request_id: null
    expected_tools:
      required:
        - get_employee_profile
