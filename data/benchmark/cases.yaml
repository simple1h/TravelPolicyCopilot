  - id: budget_hotel_limit_requires_approval_mix
    input:
      employee_id: EMP-001
      message: "Мне нужно 18 сентября утром попасть из Казани в Санкт-Петербург на встречу к 15:00. Вернуться на следующий день."
    expected_output:
      status: present_recommendations
      min_recommendations: 1
      required_budget_verdicts:
        - requires_approval
      required_policy_rule_verdicts:
        - rule_id: HOTEL_LIMIT_STANDARD
          verdict: requires_approval
        - rule_id: PREAPPROVAL_OVER_THRESHOLD
          verdict: requires_approval
    expected_tools:
      required:
        - get_employee_profile
        - search_travel_options
        - retrieve_travel_policy
        - check_budget

  - id: weak_retrieval_low_score_context_still_safe
    input:
      employee_id: EMP-001
      message: "Нужна командировка из Владивостока в Мурманск 18 сентября, вернуться 19 сентября. Нужны правила qwerty zzzz."
    expected_output:
      status: propose_constraint_change
      approval_request_id: null
    expected_tools:
      required:
        - get_employee_profile
        - search_travel_options
      forbidden:
        - create_approval_request

  - id: rag_question_with_trip_context
    input:
      employee_id: EMP-002
      message: "Мне нужно 18 сентября попасть из Казани в Москву и вернуться 19 сентября. Поясни, какие пункты политики по классу и бюджету применены."
    expected_output:
      status: present_recommendations
      min_recommendations: 1
      min_retrieved_chunks: 1
      require_assembled_policy_context: true
      required_policy_rule_verdicts:
        - rule_id: TRANSPORT_CLASS_LIMIT
          verdict: pass
    expected_tools:
      required:
        - get_employee_profile
        - search_travel_options
        - retrieve_travel_policy
