      count:
        search_travel_options: 1
      key_arguments:
        - tool: search_travel_options
          path: trip_request_payload.origin_city
          equals: Казань
        - tool: search_travel_options
          path: trip_request_payload.destination_city
          equals: Санкт-Петербург
      forbidden:
        - create_approval_request

  - id: external_api_error_4xx_branch
    input:
      employee_id: EMP-002
      message: "Мне нужно 18 сентября утром попасть из Казани в Санкт-Петербург и вернуться на следующий день. [scenario=error_4xx]"
    expected_output:
